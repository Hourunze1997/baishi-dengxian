<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>百世登仙 · 文字轮回修仙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e11; --panel:#12161b; --panel2:#161b22; --line:#2a313a;
  --tx:#d8d0bd; --dim:#8b8676; --gold:#c9a86a; --gold2:#e8cf9a;
  --red:#b8433a; --teal:#5e8f8a; --pink:#c58a9a; --purple:#8f7ab5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:'Noto Serif SC','STKaiti','KaiTi',serif;
  display:flex;justify-content:center;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,#1a2028 0%,var(--bg) 60%);
}
#app{width:100%;max-width:560px;min-height:100vh;position:relative;display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column;animation:fadein .45s ease}
.scr.on{display:flex}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,168,106,0)}50%{box-shadow:0 0 18px 2px rgba(201,168,106,.35)}}
@keyframes sealpop{from{opacity:0;transform:scale(1.8) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(-8deg)}}

/* 图槽 */
.art{position:relative;overflow:hidden;background:#0e1216}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art-fb{display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#1a222b,#0d1116 70%)}
.art-fb span{font-size:56px;font-weight:900;color:rgba(201,168,106,.55);
  border:2px solid rgba(179,67,58,.65);padding:8px 18px;transform:rotate(-8deg);
  font-family:'STKaiti','KaiTi',serif;letter-spacing:4px}

/* 标题页 */
#scr-title{justify-content:flex-end;position:relative;min-height:100vh}
#title-art{position:absolute;inset:0}
#title-art:after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,var(--bg) 4%,rgba(11,14,17,.35) 40%,rgba(11,14,17,.15))}
#title-box{position:relative;padding:26px 22px 34px;text-align:center}
#title-box h1{font-size:54px;font-weight:900;letter-spacing:14px;color:var(--gold2);
  text-shadow:0 2px 24px rgba(0,0,0,.8);margin-left:14px}
#title-box .sub{margin-top:10px;color:var(--dim);letter-spacing:5px;font-size:14px}
.seal{display:inline-block;background:var(--red);color:#f3e6d8;font-weight:900;
  padding:5px 9px;font-size:13px;letter-spacing:3px;transform:rotate(-8deg);
  box-shadow:0 2px 10px rgba(0,0,0,.6);animation:sealpop .6s ease .3s both}
#title-btns{margin-top:26px;display:flex;flex-direction:column;gap:12px}
#title-foot{margin-top:22px;font-size:11px;color:#5c584c;letter-spacing:1px}

/* 通用按钮 */
.btn{display:block;width:100%;padding:13px 14px;border:1px solid var(--line);
  background:var(--panel);color:var(--tx);font-size:15px;letter-spacing:2px;
  cursor:pointer;border-radius:6px;font-family:inherit;transition:.15s;text-align:center}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.gold{background:linear-gradient(160deg,#3a2f1c,#241d12);border-color:#6b5a35;color:var(--gold2);font-weight:600}
.btn.gold:not(:disabled){animation:pulse 2.2s infinite}
.btn.red{background:linear-gradient(160deg,#3a1d1a,#241210);border-color:#6b3535;color:#e0a49e}
.btn.mini{width:auto;display:inline-block;padding:7px 14px;font-size:13px}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--dim)}

/* 卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:16px;margin:10px 14px;position:relative}
.card:before{content:'';position:absolute;inset:5px;border:1px solid rgba(201,168,106,.14);
  border-radius:7px;pointer-events:none}
.card .corner{position:absolute;width:14px;height:14px;border-color:var(--gold);border-style:solid;opacity:.55}
.c-tl{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:10px 0 0 0}
.c-tr{top:-1px;right:-1px;border-width:2px 2px 0 0;border-radius:0 10px 0 0}
.c-bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px;border-radius:0 0 0 10px}
.c-br{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 10px 0}

/* 开局页 */
#scr-roll{padding:16px 0 30px}
#roll-name{text-align:center;font-size:34px;font-weight:900;letter-spacing:8px;margin:14px 0 2px;color:var(--gold2)}
#roll-sub{text-align:center;color:var(--dim);font-size:12px;letter-spacing:3px;margin-bottom:8px}
.rgrid{display:flex;gap:10px;margin:10px 14px}
.rgrid .card{flex:1;margin:0}
.olabel{font-size:11px;color:var(--dim);letter-spacing:2px;margin-bottom:5px}
.chip{display:inline-block;padding:3px 10px;border:1px solid var(--line);border-radius:20px;
  font-size:12px;margin:2px 4px 2px 0;background:var(--panel2)}
.chip.gold{border-color:#6b5a35;color:var(--gold2)}
.chip.red{border-color:#6b3535;color:#dd9a92}
.chip.teal{border-color:#3f5f5c;color:#9cc3be}
.chip.pink{border-color:#6b4a55;color:#e0aab8}
.chip.purple{border-color:#574a75;color:#b6a6da}
#roll-fates{margin:10px 14px}
.fate-row{padding:8px 0;border-bottom:1px dashed #232930}
.fate-row:last-child{border-bottom:none}
.fate-row b{color:var(--gold)}
.fate-row p{font-size:13px;color:var(--dim);margin-top:2px}
#roll-btns{display:flex;gap:10px;margin:16px 14px 0}
#roll-btns .btn{flex:1}
#roll-tal{margin:8px 14px;font-size:12px;color:var(--dim);line-height:1.9}

/* 主界面 */
#hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
#hdr .who{font-size:17px;font-weight:600;letter-spacing:2px}
#hdr .who em{font-style:normal;color:var(--gold);font-size:14px;margin-left:8px}
#hdr .who .world{font-size:11px;color:var(--dim);margin-left:8px;letter-spacing:1px}
#btn-info{background:none;border:1px solid var(--line);color:var(--dim);width:34px;height:34px;
  border-radius:8px;font-size:16px;cursor:pointer;font-family:inherit}
#bars{padding:4px 16px}
.brow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px;color:var(--dim)}
.brow .bl{width:34px;flex:none;letter-spacing:1px}
.bar{flex:1;height:7px;background:#1a2028;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#7a6236,var(--gold));transition:width .5s}
.bar.hp i{background:linear-gradient(90deg,#4a6e5e,#7fae95)}
.bar.hp.danger i{background:linear-gradient(90deg,#7a3a30,var(--red))}
#strow{display:flex;gap:6px;padding:6px 16px 2px;flex-wrap:wrap}
.st{flex:1;min-width:60px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:5px 4px;text-align:center}
.st b{display:block;font-size:15px;color:var(--gold2)}
.st span{font-size:10px;color:var(--dim);letter-spacing:1px}
#stchips{padding:4px 16px;min-height:6px}
#stchips .chip{font-size:11px;padding:2px 9px}
#card-wrap{flex:1;min-height:200px;display:flex;flex-direction:column;justify-content:flex-start}
.ev-tag{position:absolute;top:-9px;left:14px;background:var(--bg);padding:1px 10px;
  font-size:11px;letter-spacing:2px;border-radius:10px}
#ev-title{font-size:18px;font-weight:600;letter-spacing:2px;color:var(--gold2);margin-bottom:8px}
#ev-text{font-size:14.5px;line-height:1.95;color:#c9c2b0}
#ev-loc{font-size:11px;color:#6a6557;margin-top:10px;letter-spacing:1px}
.ev-art{height:150px;border-radius:8px;margin-bottom:12px}
.ev-art.art-fb span{font-size:40px}
#ev-choices{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.choice{width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line);
  background:var(--panel2);color:var(--tx);border-radius:8px;font-size:14px;cursor:pointer;
  font-family:inherit;transition:.15s;line-height:1.5}
.choice:not(:disabled):hover{border-color:#6b5a35}
.choice:active{transform:scale(.98)}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice .req{display:block;font-size:11px;color:var(--dim);margin-top:2px}
#acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px 20px}
#acts .btn{padding:14px}
#acts .btn small{display:block;font-size:10.5px;color:var(--dim);letter-spacing:1px;margin-top:3px;font-weight:400}
.res-mark{font-size:13px;color:var(--gold);letter-spacing:3px;margin-bottom:6px}
.g{color:var(--gold2)}
.rd{color:#dd8a80}
.gr{color:#8fbf9f}
.bl2{color:#8fb8d8}

/* 结算页 */
#scr-end{padding:20px 0 40px}
#end-cause{text-align:center;font-size:13px;color:var(--dim);letter-spacing:4px;margin-bottom:4px}
#end-name{text-align:center;font-size:30px;font-weight:900;letter-spacing:6px;color:var(--gold2)}
#end-art{height:170px;margin:14px 14px 4px;border-radius:10px}
#bio{font-size:14px;line-height:2.1;color:#c4bda9;margin:12px 14px;text-align:justify}
#end-stats{display:flex;gap:8px;margin:4px 14px}
#end-stats .st b{color:var(--gold2)}
#end-dao{text-align:center;margin:16px 0 6px;font-size:14px;color:var(--dim);letter-spacing:2px}
#end-dao b{font-size:30px;color:var(--gold2);margin:0 6px;font-weight:900}
#end-btns{margin:14px 14px 0;display:flex;gap:10px}

/* 商店 */
#scr-shop{padding:18px 0 40px}
#shop-hd{text-align:center;margin-bottom:4px}
#shop-hd h2{font-size:24px;letter-spacing:6px;color:var(--gold2)}
#shop-hd p{color:var(--dim);font-size:12px;margin-top:4px;letter-spacing:2px}
#shop-bal{text-align:center;margin:12px 0;font-size:14px;color:var(--dim)}
#shop-bal b{font-size:24px;color:var(--gold2);margin-left:6px;font-weight:900}
#tal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px}
.tal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;position:relative}
.tal b{color:var(--gold2);font-size:15px;letter-spacing:1px}
.tal p{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.7;min-height:40px}
.tal .cost{margin-top:8px;font-size:12px;color:var(--gold)}
.tal.owned{border-color:#4a5f45;background:linear-gradient(160deg,#15201a,#101711)}
.tal.owned .cost{color:#7fae95}
#shop-go{margin:18px 14px 0}

/* 弹层 */
#modal{position:fixed;inset:0;background:rgba(5,7,9,.75);display:none;z-index:50;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
#modal.on{display:flex}
.m-box{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;
  width:100%;max-width:560px;max-height:82vh;overflow-y:auto;padding:18px 16px 26px}
.m-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  position:sticky;top:-18px;background:var(--panel);padding-top:2px;z-index:2}
.m-hd b{font-size:17px;letter-spacing:3px;color:var(--gold2)}
.m-x{background:none;border:1px solid var(--line);color:var(--dim);width:30px;height:30px;
  border-radius:8px;cursor:pointer;font-family:inherit}
.m-sec{margin:14px 0 6px;font-size:12px;color:var(--gold);letter-spacing:3px;
  border-bottom:1px dashed #2a313a;padding-bottom:6px}
.shop-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px dashed #20262e}
.shop-item .si{flex:1}
.shop-item .si b{font-size:14px;color:var(--tx)}
.shop-item .si p{font-size:11.5px;color:var(--dim);margin-top:2px}
.shop-item .btn{flex:none;width:auto;padding:6px 13px;font-size:12px}
.gongfa-item{padding:9px 0;border-bottom:1px dashed #20262e;font-size:13px}
.gongfa-item b{color:var(--gold2)}
.gongfa-item p{color:var(--dim);font-size:11.5px;margin-top:2px}
.tl-item{display:flex;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px dashed #1c2229}
.tl-item em{font-style:normal;color:var(--gold);flex:none;width:38px;text-align:right}
.hist-item{padding:9px 0;border-bottom:1px dashed #1c2229}
.hist-hd{display:flex;align-items:center;gap:8px;font-size:13.5px}
.hist-hd em{font-style:normal;color:var(--gold);flex:none}
.hist-hd .chip{margin:0;font-size:10px;padding:1px 8px}
.hist-c{font-size:11.5px;color:var(--dim);margin-top:3px}
.hist-x{font-size:12.5px;color:#b5ae9c;margin-top:4px;line-height:1.85}
.danger-zone{margin-top:18px;text-align:center}
#toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);background:rgba(18,22,27,.95);
  border:1px solid #6b5a35;color:var(--gold2);padding:10px 22px;border-radius:8px;font-size:14px;
  letter-spacing:2px;z-index:99;display:none;box-shadow:0 4px 20px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div id="app">

  <!-- 标题 -->
  <div class="scr" id="scr-title">
    <div id="title-art" class="art"></div>
    <div id="title-box">
      <span class="seal">輪迴</span>
      <h1>百世登仙</h1>
      <div class="sub">一世一轮回 · 百世证长生</div>
      <div id="title-btns">
        <button class="btn gold" id="btn-new">入 世</button>
        <button class="btn" id="btn-cont" style="display:none">继 续 此 劫</button>
      </div>
      <div id="title-foot">灵感致敬文字轮回修仙品类 · 配图由 AI 生成</div>
    </div>
  </div>

  <!-- 开局 -->
  <div class="scr" id="scr-roll">
    <div id="roll-sub">—— 第 <span id="roll-world">1</span> 世 · 天命初定 ——</div>
    <div id="roll-name"></div>
    <div id="roll-sub2" style="text-align:center;font-size:11px;color:#5c584c;letter-spacing:2px">此身此命，皆是随机，不服？改签。</div>
    <div class="rgrid">
      <div class="card">
        <div id="roll-art" class="art" style="height:130px;border-radius:8px"></div>
        <div class="olabel" style="margin-top:8px">出身</div>
        <div id="roll-origin" style="font-size:15px;color:var(--gold2)"></div>
        <div id="roll-origind" style="font-size:12px;color:var(--dim);margin-top:4px;line-height:1.7"></div>
      </div>
      <div class="card">
        <div class="olabel">灵根</div>
        <div id="roll-lg" style="font-size:15px"></div>
        <div id="roll-lgd" style="font-size:12px;color:var(--dim);margin-top:4px;line-height:1.7"></div>
        <div class="olabel" style="margin-top:12px">寿元</div>
        <div id="roll-life" style="font-size:15px;color:var(--teal)"></div>
      </div>
    </div>
    <div id="roll-fates" class="card"></div>
    <div id="roll-tal"></div>
    <div id="roll-btns">
      <button class="btn ghost" id="btn-reroll"></button>
      <button class="btn gold" id="btn-start">此为天命 · 入世</button>
    </div>
  </div>

  <!-- 主界面 -->
  <div class="scr" id="scr-main">
    <div id="hdr">
      <div class="who"><span id="h-name"></span><em id="h-realm"></em><span class="world" id="h-world"></span></div>
      <button id="btn-info">☰</button>
    </div>
    <div id="bars">
      <div class="brow"><span class="bl">寿元</span><div class="bar hp" id="bar-life"><i></i></div><span id="life-txt"></span></div>
      <div class="brow"><span class="bl">修为</span><div class="bar" id="bar-exp"><i></i></div><span id="exp-txt"></span></div>
    </div>
    <div id="strow"></div>
    <div id="stchips"></div>
    <div id="card-wrap"></div>
    <div id="acts"></div>
  </div>

  <!-- 结算 -->
  <div class="scr" id="scr-end">
    <div id="end-cause"></div>
    <div id="end-name"></div>
    <div id="end-art" class="art"></div>
    <div id="bio"></div>
    <div id="end-stats"></div>
    <div id="end-dao"></div>
    <div id="end-btns"><button class="btn gold" id="btn-shop">入轮回 · 点化天赋</button></div>
  </div>

  <!-- 天赋商店 -->
  <div class="scr" id="scr-shop">
    <div id="shop-hd"><h2>轮 回 点 化</h2><p>以毕生道韵，铸来世之基 —— 天赋永随，生生不灭</p></div>
    <div id="shop-bal"></div>
    <div id="tal-grid"></div>
    <div id="shop-go"><button class="btn gold" id="btn-reinc">转 世 重 修</button></div>
  </div>

  <div id="modal"><div class="m-box" id="m-box"></div></div>
  <div id="toast"></div>
</div>
<script>
/* ================= 百世登仙 · 数据层 ================= */
'use strict';
var $=function(id){return document.getElementById(id)};
function R(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function ck(p){return Math.random()*100<p}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function G(t){return '<span class="g">'+t+'</span>'}
function Rd(t){return '<span class="rd">'+t+'</span>'}
function Gr(t){return '<span class="gr">'+t+'</span>'}
function Bl(t){return '<span class="bl2">'+t+'</span>'}

var REALMS=[
 {n:'凡人',need:60,life:0,base:95,desc:'芸芸众生，尚未叩开仙门'},
 {n:'练气',need:180,life:20,base:85,desc:'引气入体，寿元稍长'},
 {n:'筑基',need:500,life:40,base:75,desc:'筑下道基，方为真修'},
 {n:'金丹',need:900,life:80,base:62,desc:'丹成一线，可称真人'},
 {n:'元婴',need:1600,life:150,base:52,desc:'元婴不灭，夺舍重生'},
 {n:'化神',need:3000,life:300,base:44,desc:'神游太虚，言出法随'},
 {n:'炼虚',need:5500,life:500,base:36,desc:'炼虚合道，移山填海'},
 {n:'合体',need:10000,life:800,base:30,desc:'法体同辉，寿逾千载'},
 {n:'大乘',need:18000,life:1200,base:24,desc:'大乘之境，陆地神仙'},
 {n:'渡劫',need:30000,life:1600,base:13,desc:'九霄雷劫，一步登仙'}
];

var ORIGINS=[
 {id:'shijia',n:'世家子弟',d:'生于修仙世家，丹药功法不缺，族人皆是修士。',bones:1,stones:500},
 {id:'liehu',n:'山村猎户',d:'猎户之子，筋骨强健，自幼与山林猛兽周旋。',bones:2,maxAge:5},
 {id:'shuxiang',n:'书香门第',d:'耕读传家，自幼博览群书，一点即通。',wuxing:2,stones:60},
 {id:'shangjia',n:'商贾之家',d:'家中通商南北，金银流水一般，只是身子骨弱些。',stones:800,bones:-1},
 {id:'huangzi',n:'落魄皇子',d:'前朝余孽，隐姓埋名。气运加身，却也仇家暗伏。',qiyun:2,stones:300,flag:'choujia'},
 {id:'sanren',n:'山野散人',d:'采药为生，常遇云游修士，仙缘不俗。',qiyun:1,flag:'sanren'},
 {id:'moyi',n:'魔道遗孤',d:'魔门覆灭之夜的唯一幸存者，功法邪异，正道侧目。',bones:1,daoxin:-1,flag:'mo'},
 {id:'jiangmen',n:'将门之后',d:'将门虎子，弓马娴熟，心志坚毅，唯于经义一途平平。',bones:1,daoxin:1,wuxing:-1,stones:150}
];

var LINGGEN=[
 {n:'废灵根',d:'灵窍淤塞，修炼事倍功半。',m:0.45,w:10,c:'#8a8a8a'},

function E(id,tag,w,min,cond,t,x,c){EV.push({id:id,tag:tag,w:w,min:min||0,cond:cond||null,t:t,x:x,c:c})}
function gs(s,n){if(n>0&&f(s,'caiyun'))n=Math.round(n*1.5);s.stones=Math.max(0,s.stones+n)}
function gx(s,n){s.exp+=Math.round(n*expMult(s)*(1+s.realm*0.45))}
function stAdd(s,k,n){s[k]=clamp(s[k]+n,1,15)}
function lifA(s,n){s.maxAge+=n}
function hurt(s,y){s.st.push({n:'重伤',y:y||3})}
function xinmo(s,y){s.st.push({n:'心魔',y:y||6})}
function wudao(s,y){s.st.push({n:'悟道',y:y||5})}
function logT(s,t){s.tl.push({a:s.age,t:t})}
function histPush(s,h){if(!s.hist)s.hist=[];s.hist.push(h);if(s.hist.length>150)s.hist.shift()}
function fight(s,need,win,lose){
  var p=pw(s)+R(0,8);
  if(p>=need){return win()} hurt(s); return lose();
}
function f(s,id){return s.fl.indexOf(id)>=0}
function tal(id){return M.tal.indexOf(id)>=0}

function giveFabao(s,tier){
  var t=clamp(tier,1,5);
  if(s.fabao){s.fabao.tier=clamp(Math.max(t,s.fabao.tier+1),1,5)}
  else s.fabao={n:pick(FBNAMES[t]),tier:t};
  logT(s,'得法宝「'+s.fabao.n+'」('+FBTIER[s.fabao.tier]+')');
  return s.fabao;
}
function randGongfa(s){
  var cand=Object.keys(GONGFA).filter(function(g){return s.gongfa.indexOf(g)<0});
  if(!cand.length)return null;
  var gid=pick(cand); s.gongfa.push(gid); logT(s,'习得《'+GONGFA[gid].n+'》'); return GONGFA[gid];
}

function newMeta(){M={daoYun:0,lives:0,tal:[],best:0,rrLeft:3}}
function fateObj(fid){for(var i=0;i<FATES.length;i++)if(FATES[i].id===fid)return FATES[i];return null}
function fateExpB(s){var b=0;s.fates.forEach(function(fid){var t=fateObj(fid);if(t&&t.expB)b+=t.expB});return b}
function expMult(s){
  var m=LINGGEN[s.lg].m*(1+fateExpB(s));
  if(tal('daoti'))m*=1.25;
  s.gongfa.forEach(function(gid){var g=GONGFA[gid];if(g&&g.expB)m*=1+g.expB});
  if(s.fabao&&s.fabao.tier>=3)m*=1.1;
  if(s.daolv){m*=1.15;if(tal('shuangXiu'))m*=1.3}
  s.st.forEach(function(x){if(x.n==='重伤')m*=0.6;if(x.n==='悟道')m*=1.5});
  if(s.wl>0)m*=1.5;
  return m;
}
function expYr(s){return (5+s.wuxing*1.5)*expMult(s)}
function pw(s){
  var p=s.bones*2.5+s.realm*6;
  s.gongfa.forEach(function(gid){var g=GONGFA[gid];if(g&&g.pw)p+=g.pw});
  if(s.fabao)p+=s.fabao.tier*2;
  if(f(s,'jianchi'))p+=5;
  if(tal('jianxin'))p+=8;
  if(f(s,'moGu'))p+=4;
  s.st.forEach(function(x){if(x.n==='重伤')p*=0.6});
  return Math.round(p);
}
function breakChance(s){
  var c=REALMS[s.realm].base+(s.bones-5)*1.6+(s.daoxin-5)*1.2;
  s.gongfa.forEach(function(gid){var g=GONGFA[gid];if(g&&g.brk)c+=g.brk});
  if(s.fabao&&s.fabao.tier>=5)c+=10;
  if(tal('tianMing'))c+=5;
  if(s.pills.pjing>0)c+=15;
  s.st.forEach(function(x){if(x.n==='心魔')c-=15});
  return clamp(Math.round(c),5,97);
}
function marketDiscount(s){
  var d=1;if(tal('danxiang')){} s.gongfa.forEach(function(gid){if(GONGFA[gid]&&GONGFA[gid].pill)d-=GONGFA[gid].pill});
  return Math.max(0.6,d);
}

function rollOne(){
  var fl=[],oi=R(0,ORIGINS.length-1);
  var tot=0,i;LINGGEN.forEach(function(l){tot+=l.w});
  var r=Math.random()*tot;for(i=0;i<LINGGEN.length;i++){r-=LINGGEN[i].w;if(r<=0)break}
  var li=Math.min(i,LINGGEN.length-1);
  var n=ck(30)?2:1,pool=FATES.slice();
  for(var j=0;j<n&&pool.length;j++){
    var t2=0;pool.forEach(function(x){t2+=x.w});
    var rr=Math.random()*t2,acc=0,pd=null;
    pool.forEach(function(x){acc+=x.w;if(!pd&&rr<=acc)pd=x});
    if(pd){fl.push(pd.id);pool=pool.filter(function(x){return x.id!==pd.id})}
  }
  return {name:pick(XING)+pick(MING),origin:oi,lg:li,fates:fl,baseAge:R(58,74)};
}
function lifeEstimate(p){
  var a=p.baseAge,o=ORIGINS[p.origin];
  if(o.maxAge)a+=o.maxAge;
  p.fates.forEach(function(fid){var t=fateObj(fid);if(t&&t.maxAge)a+=t.maxAge});
  if(tal('guixi'))a+=15;
  return a;
}
function startLife(){
  var r=pend;pend=null;M.lives++;
  var s={name:r.name,origin:r.origin,lg:r.lg,fates:r.fates};
  s.age=R(14,18);s.maxAge=r.baseAge;

  s.bones=5;s.wuxing=5;s.qiyun=5;s.daoxin=5;
  var o=ORIGINS[s.origin];
  ['bones','wuxing','qiyun','daoxin'].forEach(function(k){if(o[k])s[k]+=o[k]});
  if(o.stones)s.stones+=o.stones;if(o.maxAge)s.maxAge+=o.maxAge;
  s.fates.forEach(function(fid){var t=fateObj(fid);if(!t)return;
    ['bones','wuxing','qiyun','daoxin'].forEach(function(k){if(t[k])s[k]+=t[k]});
    if(t.all)['bones','wuxing','qiyun','daoxin'].forEach(function(k){s[k]+=1});
    if(t.stones)s.stones+=t.stones;if(t.maxAge)s.maxAge+=t.maxAge;});
  if(tal('huigen'))s.wuxing+=2;
  if(tal('guxiang'))s.bones+=2;
  if(tal('fuyuan'))s.qiyun+=2;
  if(tal('panshi'))s.daoxin+=2;
  if(tal('guixi'))s.maxAge+=15;
  if(tal('shengcai'))s.stones+=400;
  ['bones','wuxing','qiyun','daoxin'].forEach(function(k){s[k]=clamp(s[k],1,15)});
  s.fl=[];if(o.flag)s.fl.push(o.flag);
  s.fates.forEach(function(fid){var t=fateObj(fid);if(t&&t.flag)s.fl.push(t.flag)});
  s.sect=null;s.contrib=0;s.gongfa=[];s.fabao=null;
  s.yuan=null;s.yuanFail=false;s.daolvDead=false;
  s.st=[];s.pills={pjing:0,yanshou:0,xisui:0};

  s.tl.push({a:s.age,t:'降生于世（'+ORIGINS[s.origin].n+'，'+LINGGEN[s.lg].n+'）'});
  S=s;cur=null;save();show('scr-main');render();
}

}

var CAUSE={'寿元耗尽':'大限已至，含笑坐化。','渡劫失败':'渡劫失败，形神俱灭，只余焦土。',
 '夺舍殒命':'神魂被夺，此身易主。','伤重不治':'旧伤复发，药石无医。','飞升':'天门洞开，乘光而去——此世圆满！'};

function daoYunGain(){
  var d=S.realm*3+(S.daolv&&!S.daolvDead?2:0)+(S.fabao?S.fabao.tier:0)+S.gongfa.length+(S.sect?1:0);
  d+=Math.floor(S.evCount/12)+Math.floor(S.age/60);

}

function stbox(k,v){return '<div class="st"><b>'+v+'</b><span>'+k+'</span></div>'}
function bio(){
  var s=S,p=[];
  p.push(s.name+'，'+ORIGINS[s.origin].n+'，'+LINGGEN[s.lg].n+'。');
  if(s.fates.length){var ns=[];s.fates.forEach(function(fid){var t=fateObj(fid);if(t)ns.push(t.n)});
    p.push('命带「'+ns.join('」「')+'」。')}
  var ms=s.tl.filter(function(x){return /^(突破|拜入|习得|得法宝|以陨铁|与|宗门大比|魔潮之战|妖乱之战|祭炼)/.test(x.t)});
  if(ms.length)p.push(ms.map(function(x){return x.a+'岁'+x.t}).join('；')+'。');

/* ---- 行动：推演天机（点一下，过一年或几年，事件随机而至） ---- */
function doAct(k){
  if(!S||S.dead||k!=='tap')return;
  var y=R(1,3);
  if(passYears(y)){render();return}
  S.exp+=Math.round(y*expYr(S));
  afterAction(y,0,70);
}
function afterAction(y,expGain,p){
  if(expGain)S.exp+=Math.round(expGain);
  if(S.dead){render();return}
  if(S.pendW){
    var ws=EV.filter(function(e){return e.tag==='天下'&&(!e.cond||e.cond(S))});
    if(ws.length){S.pendW=false;showEvent(pick(ws));return}}
  if(ck(p)){var e=pickEvent();if(e){showEvent(e);return}}
  cur={res:pickIdle(S),title:'岁月流转',tag:'人情'};render();save();
}

  });

      SECTS.forEach(function(st){
        var dis=st.reqDx&&S.daoxin<st.reqDx;
        h+='<div class="shop-item"><div class="si"><b>'+st.n+'</b><span style="font-size:11px;color:var(--dim)"> '+st.style+'</span><p>'+st.d+(st.reqDx?'（需道心≥'+st.reqDx+'）':'')+'</p></div>'+

    h+='<p style="font-size:13px;padding:4px 0">门派：<b class="g">'+st2.n+'</b> · 贡献 <b class="g">'+S.contrib+'</b></p>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;padding:4px 0">'+
      '<button class="btn mini" onclick="sectTask()">宗门差事</button>'+
      '<button class="btn mini" onclick="donate()"'+(S.stones<100?' disabled':'')+'>捐献灵石+100</button></div>';

      var owned=S.gongfa.indexOf(g.id)>=0,full=S.gongfa.length>=2;

        (owned?'<span style="color:#7fae95;font-size:12px">✓ 已习得</span>':
        '<button class="btn mini" onclick="learnGF(\''+g.id+'\')"'+((full||S.contrib<g.cost||S.stones<g.fee)?' disabled':'')+'>修习</button>')+'</div>';
    });

function buyPill(id){
  var p=null;PILLS.forEach(function(x){if(x.id===id)p=x});if(!p)return;
  var cost=pillCost(p);if(S.stones<cost)return;
  S.stones-=cost;
  if(p.id==='juqi'){var yr=8*(tal('danxiang')?1.5:1);S.exp+=Math.round(yr*expYr(S));toast('服下聚气丹，修为大涨')}
  if(p.id==='pjing'){S.pills.pjing=1;toast('破境丹已备，下次突破+15%')}
  if(p.id==='yanshou'){S.pills.yanshou++;S.maxAge+=8;toast('寿元+8')}
  if(p.id==='liao'){S.st=S.st.filter(function(x){return x.n!=='重伤'});toast('伤势痊愈')}
  if(p.id==='xisui'){S.pills.xisui++;stAdd(S,'bones',1);toast('根骨+1')}
  save();render();renderMarket();
}
function joinSect(id){
  SECTS.forEach(function(st){if(st.id===id){S.sect=id;S.contrib=50;
    logT(S,'拜入'+st.n);toast('拜入'+st.n)}});
  save();render();renderMarket();
}
function sectTask(){
  var g=R(60,120),m=R(50,100),dang=false;
  if(S.gongfa.some(function(gid){return GONGFA[gid]&&GONGFA[gid].xh}))m=Math.round(m*1.6);
  S.contrib+=g;S.stones+=m;
  var msg='办完差事：'+G('贡献+'+g+'，灵石+'+m);
  if(ck(15)){hurt(S);dang=true;msg+='<br>'+Rd('途中遇险，身负重伤')}
  else toast('差事办妥');
  S.mktMsg=msg;S.mktDang=dang;
  save();render();renderMarket();
  var el=document.createElement('div');el.className='gongfa-item';el.innerHTML=msg;
  $('m-box').appendChild(el);
}
function donate(){S.stones-=100;S.contrib+=100;toast('贡献+100');save();render();renderMarket()}
function learnGF(gid){
  var g=GONGFA[gid];if(!g)return;
  if(S.gongfa.length>=2||S.contrib<g.cost||S.stones<g.fee)return;
  S.contrib-=g.cost;S.stones-=g.fee;S.gongfa.push(gid);
  logT(S,'习得《'+g.n+'》');toast('习得《'+g.n+'》');
  save();render();renderMarket();
}
function refineFB(){

  s.tl.slice().reverse().forEach(function(x){h+='<div class="tl-item"><em>'+x.a+'岁</em><span>'+x.t+'</span></div>'});
  h+='<div class="m-sec">天 外 飞 仙</div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;padding:4px 0">'+
    '<button class="btn mini gold" onclick="cheatStones()">灵石 +999999</button>'+
    '<button class="btn mini gold" onclick="cheatYun()">道韵 +9999</button></div>';
  h+='<div class="danger-zone"><button class="btn ghost mini" onclick="wipeSave()">重开此局（清空全部轮回）</button></div>';
  $('m-box').innerHTML=h;$('modal').classList.add('on');
}
function wipeSave(){
  try{localStorage.removeItem('bsdx')}catch(e){}
  location.reload();
}

/* ---- 天外飞仙（作弊） ---- */
function cheatStones(){if(!S)return;S.stones+=999999;toast('天降灵石 +999999');save();render();openInfo()}
function cheatYun(){M.daoYun+=9999;toast('天降道韵 +9999');save();
  if($('scr-shop').classList.contains('on'))renderShop();}

/* ---- 轮回点化（天赋商店） ---- */
function showShop(){renderShop();show('scr-shop')}
function renderShop(){
  $('shop-bal').innerHTML='道韵存量<b>'+M.daoYun+'</b> <button class="btn ghost mini" style="margin-left:10px" onclick="cheatYun()">+9999</button>';
  var h='';
  TALENTS.forEach(function(t){
    var owned=tal(t.id);
    h+='<div class="tal'+(owned?' owned':'')+'"><b>'+t.n+'</b><p>'+t.d+'</p>'+
      (owned?'<div class="cost">✓ 已点化</div><button class="btn mini" disabled>生生世世 · 与你同在</button>'
            :'<div class="cost">'+t.cost+' 道韵</div><button class="btn mini gold" style="margin-top:6px" onclick="buyTal(\''+t.id+'\')"'+(M.daoYun<t.cost?' disabled':'')+'>点化</button>')+'</div>';
  });
  $('tal-grid').innerHTML=h;
}
function buyTal(id){
  var t=null;TALENTS.forEach(function(x){if(x.id===id)t=x});
  if(!t||tal(id)||M.daoYun<t.cost)return;
  M.daoYun-=t.cost;M.tal.push(id);
  toast('已点化「'+t.n+'」，来世生效');
  save();renderShop();
}

/* ---- 启动 ---- */
function boot(){
  if(!load())newMeta();
  if(!M)newMeta();
  $('title-art').innerHTML=art('title');
  $('btn-new').onclick=function(){pend=rollOne();renderRoll()};
  $('btn-cont').onclick=function(){if(S.dead){showEnd()}else{show('scr-main');render()}};
  $('btn-info').onclick=openInfo;
  $('btn-reroll').onclick=doReroll;
  $('btn-start').onclick=startLife;
  $('btn-shop').onclick=showShop;
  $('btn-reinc').onclick=function(){pend=rollOne();renderRoll()};
  $('modal').onclick=function(e){if(e.target===$('modal'))closeModal()};
  if(S)$('btn-cont').style.display='block';
  show('scr-title');
}
boot();
</script></body></html>
